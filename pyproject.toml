[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-desvios"
version = "0.1.0"
description = "Radar de Desvios — POC do hackathon ETEG 2026 (leitura de Slack, Gmail, Calendar e Meet)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "slack-sdk>=3.33",
    "mcp>=1.9",
    "httpx>=0.27",
    # dependências do plano (G-01)
    "langgraph>=0.2",
    "anthropic>=0.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "slack-bolt>=1.20",
    "pymupdf>=1.24",
    "langfuse>=3.0",
    "streamlit>=1.38",
    "faker>=30.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    # O checkpointer SQLite do LangGraph (pacote langgraph-checkpoint-sqlite) é decisão do R-02
    # e não entrou aqui.
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: usa o modelo real (e5); é pulado se o download falhar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
